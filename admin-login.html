<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Arslan Corporation</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="admin.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏗️%3C/text%3E%3C/svg%3E">
</head>
<body>
<nav class="navbar" id="navbar">
    <div class="nav-container">
        <a href="index.html" class="nav-logo"><h2>ARSLAN CORPORATION</h2><span>Architects • Engineers • Developers</span></a>
    </div>
</nav>

<section class="admin-auth-section">
    <div class="admin-auth-card">
        <div class="admin-auth-icon"><i class="fas fa-lock"></i></div>
        <h1>Admin Login</h1>
        <p>Sign in to manage the team and Sale's Inventory.</p>

        <form id="loginForm" class="admin-auth-form">
            <div class="admin-field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="admin@example.com" required autocomplete="username">
            </div>
            <div class="admin-field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
            </div>
            <div id="loginError" class="admin-error" hidden></div>
            <button type="submit" class="btn btn-primary admin-submit-btn" id="loginBtn">
                <i class="fas fa-right-to-bracket"></i> Sign In
            </button>
        </form>

        <a href="index.html" class="admin-back-link"><i class="fas fa-arrow-left"></i> Back to website</a>
    </div>
</section>

<script type="module">
    import { auth } from './firebase-config.js';
    import { signInWithEmailAndPassword, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

    // Already signed in? go straight to the dashboard.
    onAuthStateChanged(auth, (user) => {
        if (user) window.location.href = 'admin-dashboard.html';
    });

    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('loginError');
    const loginBtn = document.getElementById('loginBtn');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBox.hidden = true;
        loginBtn.disabled = true;
        loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        try {
            await signInWithEmailAndPassword(auth, email, password);
            window.location.href = 'admin-dashboard.html';
        } catch (err) {
            errorBox.textContent = 'Invalid email or password.';
            errorBox.hidden = false;
            loginBtn.disabled = false;
            loginBtn.innerHTML = '<i class="fas fa-right-to-bracket"></i> Sign In';
        }
    });
</script>
</body>
</html>
